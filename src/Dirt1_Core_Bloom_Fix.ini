; Dirt1_Core_Bloom_Fix - Colin McRae: DiRT
; Put this file next to dinput8.dll in the game folder.

[Threads]
; The engine always uses at most 4 worker threads (workerMap4Core). The 8 core map breaks
; physics on race start and is never used.

; 1 = pin engine threads to the best physical cores (P-cores, no HT siblings)
; 0 = no pinning at all, let Windows schedule
; 2 = original game behaviour (1 << core)
Affinity=1

; 1 = redirect system/workerMap*.xml to the game's 4/2/1 core map for this CPU
; 0 = use whatever the game picked (hardware_settings_restrictions.xml)
WorkerMap=1

; 1 = main thread gets an ideal processor only, no hard affinity (like DiRT 2)
MainThreadSoftAffinity=1

[PostProcess]
; On-the-fly post processing tweaks, no game files are modified (inspired by
; "Colin McRae DIRT - Graphics Mod"): postprocess/effects.xml (menus) and
; tracks/<track>/effects.xml (racing) are read, parameters are replaced and the game gets a copy.
; The mod itself is not needed (if installed, these rules are applied on top of it).
; Any value = keep -> leave it as the game has it.
Enable=1

; --- Racing (track effects, cockpit view included) ---
; Bloom strength. The game uses ~0.8-1.0, the mod 0.3. 0 = no bloom at all.
Bloom=0.30
; Orange/yellow tone (tintColour 225,143,100 etc.). 0 = remove (white tint), keep = as in game.
Tint=0
; Dark screen edges. 0 = off.
Vignette=0
; Brightness (engine parameter "brighness", about -0.06 in game). 0 = neutral.
Brightness=0
; Contrast (~0.86-0.96), saturation (~0.96-1.14), gamma (1.0), motion blur length (~10-16).
Contrast=keep
Saturation=keep
Gamma=keep
MotionBlur=keep

; --- Menus ---
MenuBloom=0
MenuTint=0
MenuVignette=0

[PostProcessOverride]
; Any <Param> of tracks/*/effects.xml, for example:
;targetLuminance=0.64
;upperThreshold=1.2965
;lowerThreshold=0.2078

[Video]
; Limit the video memory the game sees (MB). 0 = no limit.
; Without a limit cards with 2+ GB become a negative value in the engine's math.
MaxVideoMemoryMB=1024

; D3D9 display mode filter. Every mode is a node in hardware_settings_info.xml, which lives in a
; fixed size pool (HARDWARE_SETTINGS). Modern Windows reports dozens of modes
; (DSR/VSR, 60..240 Hz), the pool overflows -> crash at startup (0x5999BE).
; Kept: up to MaxResolutions resolutions (the largest ones + the desktop resolution),
; each with 60 Hz and the desktop refresh rate.
FilterModes=1
MaxResolutions=12
MinWidth=800

[Misc]
; Disable Windows DPI scaling for the game
DPIAware=1
; Write Dirt1_Core_Bloom_Fix.log next to the game (or to %TEMP% if the folder is read-only)
Log=1
